<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Necro File URL Page</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h2 class="title">URL掲示板</h2>

<div class="box">
  <input id="url" type="text" placeholder="URL (https://...)">
  <textarea id="msg" maxlength="200" placeholder="メッセージ（200文字）"></textarea>
  <button id="postBtn">投稿</button>
  <p id="status"></p>
</div>

<hr>

<h3>投稿一覧</h3>
<div id="posts"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, getDocs, query, orderBy
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCzM_KVgIaq979u1reLRqH91kboB8D1yok",
  authDomain: "undertale-au-talk-web.firebaseapp.com",
  projectId: "undertale-au-talk-web"
};

const db = getFirestore(initializeApp(firebaseConfig));
const postsRef = collection(db, "posts");

const $ = (id) => document.getElementById(id);
const status = (text) => { $("status").textContent = text; };

function showError(e) {
  console.error(e);
  const code = e && e.code ? e.code : "unknown";
  if (code === "permission-denied") {
    status("保存/読み込みが拒否されました。FirebaseのFirestoreルールを確認してください。(permission-denied)");
  } else {
    status("エラー: " + code + " / " + (e && e.message ? e.message : e));
  }
}

async function load() {
  const box = $("posts");
  try {
    const snap = await getDocs(query(postsRef, orderBy("time", "desc")));
    box.textContent = "";
    snap.forEach((d) => {
      const data = d.data();
      const div = document.createElement("div");
      div.className = "post";

      const p = document.createElement("p");
      p.textContent = data.message || "";
      div.appendChild(p);

      const a = document.createElement("a");
      a.textContent = data.url || "";
      if (/^https?:\/\//i.test(data.url || "")) {
        a.href = data.url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
      }
      div.appendChild(a);

      box.appendChild(div);
    });
    if (snap.empty) status("まだ投稿がありません。");
  } catch (e) {
    showError(e);
  }
}

$("postBtn").addEventListener("click", async () => {
  const url = $("url").value.trim();
  const msg = $("msg").value.trim();

  if (!/^https?:\/\//i.test(url)) {
    status("URLは http:// か https:// から始めてください。");
    return;
  }
  if (!navigator.onLine) {
    status("オフラインです。ネットにつないでから投稿してください。");
    return;
  }

  $("postBtn").disabled = true;
  status("投稿中...");
  try {
    await addDoc(postsRef, { message: msg, url: url, time: new Date().toISOString() });
    $("url").value = "";
    $("msg").value = "";
    status("投稿しました。");
    await load();
  } catch (e) {
    showError(e);
  } finally {
    $("postBtn").disabled = false;
  }
});

load();
</script>

</body>
</html>
